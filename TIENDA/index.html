<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pixel Periféricos</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="encabezado">
    <h1>Pixel Periféricos</h1>
    <p>Accesorios para tu espacio de juego y trabajo</p>
  </header>

  <main class="contenedor">
    <section>
      <h2>Productos</h2>
      <div id="productos" class="rejilla"></div>
    </section>

    <aside class="carrito">
      <h2>Tu carrito</h2>
      <ul id="lista-carrito"></ul>
      <p id="carrito-vacio">Todavía no agregaste productos.</p>
      <p class="total">Total: <strong id="total">$0.00</strong></p>
      <button id="vaciar-carrito" class="boton boton-secundario">
        Vaciar carrito
      </button>
    </aside>
  </main>

  <script src="script.js"></script>
</body>
</html>
