<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tienda Pixel</title>
  <link rel="stylesheet" href="styles.css">
  <script src="script.js" defer></script>
</head>
<body>
  <header class="encabezado">
    <div>
      <h1>Tienda Pixel</h1>
      <p>Productos para tu día a día</p>
    </div>
    <button id="ver-cesta" class="boton boton-cesta">
      Ver cesta <span id="contador-cesta">0</span>
    </button>
  </header>

  <main class="contenedor">
    <section aria-labelledby="titulo-catalogo">
      <h2 id="titulo-catalogo">Catálogo</h2>

      <div class="controles">
        <input
          id="buscador"
          type="search"
          placeholder="Buscar productos..."
          aria-label="Buscar productos"
        >
        <select id="ordenar" aria-label="Ordenar productos">
          <option value="default">Ordenar por...</option>
          <option value="precio-asc">Precio: menor a mayor</option>
          <option value="precio-desc">Precio: mayor a menor</option>
          <option value="nombre">Nombre: A-Z</option>
          <option value="stock">Stock disponible</option>
        </select>
      </div>

      <nav id="filtros-categoria" class="filtros" aria-label="Categorías"></nav>
      <div id="productos" class="rejilla"></div>
      <p id="mensaje-catalogo" class="mensaje" hidden></p>
    </section>
  </main>

  <div id="modal-cesta" class="modal" hidden>
    <section
      class="modal-contenido"
      role="dialog"
      aria-modal="true"
      aria-labelledby="titulo-cesta"
    >
      <button id="cerrar-modal" class="cerrar" aria-label="Cerrar cesta">×</button>
      <h2 id="titulo-cesta">Tu cesta</h2>
      <p id="datos-envio" class="datos-envio"></p>
      <ul id="lista-cesta" class="lista-cesta"></ul>
      <p id="cesta-vacia" class="mensaje">La cesta está vacía.</p>
      <p class="total">Total: <strong id="total">$0.00</strong></p>
      <button id="finalizar-compra" class="boton">Finalizar compra</button>
    </section>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
</body>
</html>
